[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "balance-streamer"
dynamic = ["version"]
description = "Stream several lab balances at once over RS-232/USB, chart live flow rates, and export to Excel."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Brandon T. McReynolds" }]
keywords = ["laboratory", "balance", "scale", "serial", "rs-232", "flow-rate", "pyqt6"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "PyQt6>=6.5",
    # 0.1.7 is the only release that installs on Python 3.12+; pinned so every machine looks the same.
    "pyqtdarktheme==0.1.7",
    "pyserial>=3.5",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
build = ["pyinstaller>=6.0"]

[project.urls]
Homepage = "https://github.com/brandonbtm29/Balance-Streamer-GUI"
Changelog = "https://github.com/brandonbtm29/Balance-Streamer-GUI/blob/main/CHANGELOG.md"
Issues = "https://github.com/brandonbtm29/Balance-Streamer-GUI/issues"

[project.gui-scripts]
balance-streamer = "balance_streamer.app:main"

[tool.hatch.version]
path = "balance_streamer/__init__.py"

[tool.hatch.build.targets.wheel]
only-include = ["balance_streamer", "multi_balance_stream.py", "settings_location.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
# Shared helper: an identical copy lives in every UAkron lab repo, so it is left as is.
extend-exclude = ["settings_location.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
    "S101", # asserts are fine in tests
    # Existing style in the app, kept so linting doesn't change behaviour.
    # Tightening these (bare except, try/except/pass) is a follow-up.
    "E501",
    "E701",
    "E702",
    "E722",
    "S110",
    "S112",
]

[tool.ruff.lint.per-file-ignores]
# build_app.py runs pip and PyInstaller with fixed arguments.
"build_app.py" = ["S603", "S607"]
"tests/*" = ["E402"]
